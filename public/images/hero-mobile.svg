<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#0b1420"/><stop offset=".42" stop-color="#263d4a"/><stop offset=".72" stop-color="#e58b4a"/><stop offset="1" stop-color="#11140f"/></linearGradient>
  <linearGradient id="mount" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#506f72"/><stop offset="1" stop-color="#111b1a"/></linearGradient>
