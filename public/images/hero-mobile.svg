  <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#333a3b"/><stop offset=".5" stop-color="#a16f46"/><stop offset="1" stop-color="#22282a"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<rect width="1600" height="900" fill="url(#sky)"/>
